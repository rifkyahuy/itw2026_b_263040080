<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form masuk UKM Unpas</title>
</head>

<body>
  <h1>Isikan data data berikut ini:</h1>

  <form>
    <table cellpadding="4">
      <tr>
        <td align="right">
          <label for="nama">Nama:</label>
        </td>
        <td>
          <input type="text" name="nama" id="nama" placeholder="Masukkan nama">
        </td>
      </tr>
      <tr>
        <td align="right">
          <label for="password">Password:</label>
        </td>
        <td>
          <input type="password" name="password" id="password">
        </td>
      </tr>
      <tr>
        <td align="right">
          <label for="email">Email:</label>
        </td>
        <td>
          <input type="email" name="email" id="email">
        </td>
      </tr>
      <tr>
        <td align="right">
          <label for="no-telp">No. Telp/WA:</label>
        </td>
        <td>
          <input type="tel" name="no-telp" id="no-telp" placeholder="Contoh: 081234567890">
        </td>
      </tr>
      <tr>
        <td align="right">
          <label for="tanggal">Tanggal: </label>
        </td>
        <td>
          <input type="date" name="tanggal" id="tanggal">
        </td>
      </tr>
      <tr>
        <td align="right">
          <label for="warna">Pilih Warna:</label>
        </td>
        <td>
          <input type="color" name="warna" id="warna">
        </td>
      </tr>
      <tr>
        <td align="right">Hobi:</td>
        <td>
          <input type="checkbox" name="hobi" id="membaca" value="Membaca">
          <label for="membaca">Membaca</label><br>
          <input type="checkbox" name="hobi" id="olahraga" value="Olahraga">
          <label for="olahraga">Olahraga</label><br>
          <input type="checkbox" name="hobi" id="musik" value="Musik">
          <label for="musik">Musik</label>
        </td>
      </tr>
      <tr>
        <td colspan="2">
          <button type="submit">Kirim!</button>
        </td>
      </tr>
    </table>
  </form>
</body>

</html>
